name: Construire l'APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décoder les logos
        run: for f in www/*.b64; do [ -f "$f" ] || continue; base64 -d "$f" > "${f%.b64}"; rm "$f"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Autoriser l'appareil photo
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EtatDesLieuxIA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EtatDesLieuxIA-apk
          path: EtatDesLieuxIA.apk

  # Version PC : publie l'appli sur GitHub Pages (https://TON-PSEUDO.github.io/NOM-DU-DEPOT/)
  site:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Décoder les logos
        run: for f in www/*.b64; do [ -f "$f" ] || continue; base64 -d "$f" > "${f%.b64}"; rm "$f"; done
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - uses: actions/deploy-pages@v4
        continue-on-error: true
