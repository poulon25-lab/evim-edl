<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>État des Lieux IA · evim</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" class="boot"><img src="logo.png" alt="evim immobilier"><span class="spinner d"></span></div>
<div id="auth" hidden></div>
<div id="app" hidden>
  <aside id="sidebar">
    <img class="logo" src="logo.png" alt="evim immobilier — By NSimo">
    <button class="btn block new" data-nav="new"></button>
    <nav id="side-nav"></nav>
    <div class="me" id="side-me"></div>
  </aside>
  <div id="main">
    <header id="topbar">
      <button id="btn-back" class="icon-btn" aria-label="Retour" hidden></button>
      <img class="brand-m" id="brand-m" src="logo-h.png" alt="evim">
      <h1 id="title"></h1>
      <div id="top-actions"></div>
    </header>
    <main id="view"></main>
  </div>
  <nav id="bottomnav"></nav>
</div>
<div id="toast" hidden></div>
<div id="modal" hidden></div>
<input type="file" id="in-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="in-gallery" accept="image/*" multiple hidden>
<input type="file" id="in-import" accept=".json,application/json" hidden>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
<script src="backend.js"></script>
<script src="gemini.js"></script>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
